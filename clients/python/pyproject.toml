[project]
name = "marciana-client"
version = "0.1.0"
description = "Typed transport-neutral Python client for Marciana memory verbs"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["marciana_client"]
