name: Sail upstream baseline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "scripts/**"
      - "compat/sail-revision.txt"
      - "COMPATIBILITY.md"
      - ".github/workflows/sail-baseline.yml"
  push:
    branches: [main, master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "scripts/**"
      - "compat/sail-revision.txt"
      - "COMPATIBILITY.md"
      - ".github/workflows/sail-baseline.yml"

permissions:
  contents: read

jobs:
  current-upstream-source:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      # Sail's full-LTO link exceeds smaller hosted runners; integration tests
      # require the current source behavior, not release-profile LTO.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Fetch and verify current canonical Sail revision
        shell: bash
        run: |
          set -euo pipefail
          recorded="$(tr -d '[:space:]' < compat/sail-revision.txt)"
          test "${#recorded}" -eq 40
          git clone --filter=blob:none --no-checkout https://github.com/lakehq/sail.git sail-upstream
          git -C sail-upstream fetch --depth=1 origin main
          current="$(git -C sail-upstream rev-parse origin/main)"
          if [[ "$recorded" != "$current" ]]; then
            echo "Recorded Sail revision $recorded is not current upstream $current" >&2
            exit 1
          fi
          git -C sail-upstream checkout --detach "$recorded"
      - name: Build Sail from recorded upstream source
        run: cargo build --release -p sail-cli
        working-directory: sail-upstream
      - name: Run live Marciana gate when crates exist
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 > metadata.json
          if jq -e '.packages | length > 0' metadata.json >/dev/null; then
            test -x scripts/test-live-sail.sh
            SAIL_TEST_BIN="$PWD/sail-upstream/target/release/sail" \
              scripts/test-live-sail.sh
          fi
