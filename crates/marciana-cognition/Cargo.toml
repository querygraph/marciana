marciana-catalog = { path = "../marciana-catalog", version = "0.12.0" }
querygraph-memory = { path = "../marciana-memory", version = "0.12.0", features = ["sail"] }
serde_json = { workspace = true }
serde = { workspace = true }
sha2 = "0.10"
tokio = { workspace = true }
typesec-core = { git = "https://github.com/querygraph/typesec.git", branch = "main", version = "0.13.0" }
typesec-integrations = { git = "https://github.com/querygraph/typesec.git", branch = "main", version = "0.13.0" }
