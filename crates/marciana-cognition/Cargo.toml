[package]
name = "marciana-cognition"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Marciana cognition composition primitives"
publish = false

[features]
test-support = []

[dependencies]
async-trait = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
grust = { package = "grust-graph", git = "https://github.com/querygraph/grust.git", rev = "3bbd715b5e9aae66d83b68feebb85d9e16f61271", version = "0.12.0", features = ["sail"] }
