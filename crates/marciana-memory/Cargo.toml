[package]
name = "querygraph-memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Capability-safe TypeSec memory and governed cognition over Grust"
[features]
default = ["turso"]
turso = ["dep:grust-turso"]
sail = ["dep:arrow", "dep:grust-sail"]

[dependencies]
grust-core = "0.13.0"
grust-turso = { version = "0.13.0", optional = true }
grust-sail = { version = "0.13.0", optional = true }
typesec-memory = "0.14.0"
typesec-core = "0.14.0"
marciana-ledger = { path = "../marciana-ledger", version = "0.13.0" }
chrono = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
sha2 = "0.10"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "time"] }
tracing = "0.1"
uuid = { workspace = true }
async-trait = { workspace = true }
arrow = { version = "58.1.0", features = ["ipc_compression"], optional = true }

[dev-dependencies]
criterion = { workspace = true }
grust-memory = "0.13.0"
tempfile = { workspace = true }
typesec-memory = { version = "0.14.0", features = ["conformance"] }
typesec-core = "0.14.0"
typesec-rbac = { version = "0.14.0", default-features = false }
static_assertions = "1"
tokio = { workspace = true, features = ["test-util"] }

[[bench]]
name = "memory"
harness = false

[[bench]]
name = "domain"
harness = false

[[bench]]
name = "engine"
harness = false

[[bench]]
name = "persistence"
harness = false

[[bench]]
name = "commit"
harness = false

[lints]
workspace = true
