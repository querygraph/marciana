[package]
name = "querygraph-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Capability-safe TypeSec memory and governed cognition over Grust"
# This product crate is distributed from Marciana's exact Git revision until
# the coordinated crate-release line is versioned.
publish = false

[features]
default = ["turso"]
turso = ["dep:grust-turso"]
sail = ["dep:arrow", "dep:grust-sail"]

[dependencies]
grust-core = { git = "https://github.com/querygraph/grust.git", rev = "3bbd715b5e9aae66d83b68feebb85d9e16f61271", version = "0.12.0" }
grust-turso = { git = "https://github.com/querygraph/grust.git", rev = "3bbd715b5e9aae66d83b68feebb85d9e16f61271", version = "0.12.0", optional = true }
grust-sail = { git = "https://github.com/querygraph/grust.git", rev = "3bbd715b5e9aae66d83b68feebb85d9e16f61271", version = "0.12.0", optional = true }
# TypeSec remains the security-contract owner. Pin its reviewed source rather
# than relying on the developer's sibling checkout.
typesec-memory = { git = "https://github.com/querygraph/typesec.git", rev = "1926f18c1d9aab640b16d530214c31f9d1492da6", version = "0.13.0" }
marciana-ledger = { path = "../marciana-ledger" }
chrono = { version = "0.4", features = ["serde"] }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
sha2 = "0.10"
thiserror = "2.0"
tokio = { workspace = true, features = ["net", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
async-trait = { workspace = true }
arrow = { version = "58.1.0", features = ["ipc_compression"], optional = true }

[dev-dependencies]
grust-memory = { git = "https://github.com/querygraph/grust.git", rev = "3bbd715b5e9aae66d83b68feebb85d9e16f61271", version = "0.12.0" }
tempfile = { workspace = true }
typesec-memory = { git = "https://github.com/querygraph/typesec.git", rev = "1926f18c1d9aab640b16d530214c31f9d1492da6", version = "0.13.0", features = ["conformance"] }
typesec-core = { git = "https://github.com/querygraph/typesec.git", rev = "1926f18c1d9aab640b16d530214c31f9d1492da6", version = "0.13.0" }
typesec-rbac = { git = "https://github.com/querygraph/typesec.git", rev = "1926f18c1d9aab640b16d530214c31f9d1492da6", version = "0.13.0", default-features = false }
static_assertions = "1"
tokio = { workspace = true, features = ["test-util"] }
