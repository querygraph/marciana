[workspace]
resolver = "3"
members = ["crates/marciana-memory"]

[workspace.package]
version = "0.12.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/querygraph/marciana"

[workspace.dependencies]
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
tokio = { version = "1.52.2", features = ["macros", "rt-multi-thread", "sync"] }
tempfile = "3.24.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
